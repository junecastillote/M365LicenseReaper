<!doctype html>
<html>

<head>
  <style>
    body {
      font-family: aptos, calibri, "Segoe UI", arial, sans-serif;
      text-align: left;
    }

    h2,
    h3 {
      margin: 0;
    }

    table {
      border-collapse: collapse;
      border: 1px solid #dddddd;
      width: 100%;
    }

    th,
    td {
      border: 1px solid #dddddd;
      padding: 5px;
      text-align: left;
      vertical-align: top;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <hr />
  <table style="border-collapse: collapse; border: 1px solid #dddddd">
    <tr>
      <td>The job completed successfully but there are no users due for license removal.</td>
    </tr>
  </table>
  <hr />
</body>

</html>
