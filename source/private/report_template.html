<!doctype html>
<html>

<head>
  <style>
    body {
      font-family: aptos, calibri, "Segoe UI", arial, sans-serif;
      text-align: left;
    }

    h2,
    h3 {
      margin: 0;
    }

    .report-table {
      border-collapse: collapse;
      border: 1px solid #dddddd;
      width: 100%;
    }

    .report-table th,
    .report-table td {
      border: 1px solid #dddddd;
      padding: 5px;
      text-align: left;
      vertical-align: top;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Task and outcome column */

    .result-column {
      width: 220px;
    }

    /* Nested result table */

    .result-table {
      border-collapse: collapse;
      border: none;
      width: auto;
    }

    .result-table th,
    .result-table td {
      border: none;
      padding: 3px 5px;
      vertical-align: middle;
    }

    .result-label {
      color: #595959;
      font-weight: bold;
      white-space: nowrap;
      width: 1%;
    }

    /* Status presentation */
    .status-success {
      background-color: #e2f0d9;
      color: #375623;
      font-weight: bold;
    }

    .status-warning {
      background-color: #fff2cc;
      color: #8a5a00;
      font-weight: bold;
    }

    .status-failed {
      background-color: #fce4d6;
      color: #9c0006;
      font-weight: bold;
    }

    .status-pending {
      background-color: #ddebf7;
      color: #1f4e78;
      font-weight: bold;
    }

    .status-simulated {
      background-color: #e4dfec;
      color: #5f497a;
      font-weight: bold;
    }

    .status-neutral {
      background-color: #f2f2f2;
      color: #595959;
      font-weight: bold;
    }

    .detail-section,
    .license-section {
      margin: 0;
      padding: 0;
    }

    .detail-separator {
      font-size: 4px;
      line-height: 4px;
      height: 4px;
    }

    .detail-section ul,
    .license-section ul {
      margin-top: 4px;
      margin-bottom: 4px;
      padding-left: 22px;
    }
  </style>
</head>

<body>
  <h2>vOrganization</h2>
  <h3>vReportTitle</h3>
  <hr />
  <table class="report-table">
    <tr>
      <th>Ticket</th>
      <th>Username</th>
      <th class="result-column" width="220">Task and Outcome</th>
      <th>Operation Details</th>
      <th>License Results</th>
      <th>Created Date</th>
      <th>Due Date</th>
      <th>Completed Date</th>
      <th>Task Owner</th>
    </tr>
    vTableRows
  </table>
  <hr />
  <table class="report-table">
    <tr>
      <td>
        <b>Host: </b>vComputerName (PowerShell vPsHostInfo)<br>
        <b>Module: </b>vModuleInfo
      </td>
    </tr>
  </table>
  <hr />
</body>

</html>
